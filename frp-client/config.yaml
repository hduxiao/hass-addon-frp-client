name: "FRP Client"
description: "You can use this tool to achieve remote access to local Home Assistant OS by port forwarding"
url: https://github.com/hduxiao/hass-addon-frp-client
version: "1.0.6"
slug: "frp_client"
host_network: true
startup: application
boot: "auto"
init: false
map:
  - "share:rw"
privileged:
  - NET_ADMIN
devices:
  - /dev/net/tun
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
options:
  serverAddr: "yourserver.com"
  serverPort: 7000
  authToken: "99E557FB-4A81-44B3-9B38-B4FBD0657E7A"
  webServerPort: 7400
  webServerUser: "admin"
  webServerPassword: "passwd"
  customDomain: "yourcustom.com"
  proxyName: "homeassistant"
schema:
  serverAddr: str
  serverPort: int
  authToken: str
  webServerPort: int
  webServerUser: str
  webServerPassword: str
  customDomain: str
  proxyName: str
